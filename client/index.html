    <script>
      // set theme before paint (no flash)
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.classList.toggle('light', t === 'light');
        } catch (e) {}
      })();
    </script>
